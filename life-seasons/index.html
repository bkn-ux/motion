<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인생의 계절</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Gowun Dodum","Jua","Nanum Round","Malgun Gothic",sans-serif}
  body{display:grid;place-items:center}
  #stage{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;background:#000;overflow:hidden;container-type:inline-size;user-select:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;background:rgba(0,0,0,.42);color:#fff;transition:opacity .5s;cursor:pointer;text-align:center}
  .ov.hide{opacity:0;pointer-events:none}
  .ov h1{margin:0;font-family:"Jua","Gowun Dodum","Malgun Gothic",sans-serif;font-weight:400;font-size:4.6cqw;letter-spacing:.18em;text-shadow:0 .3cqw 1.2cqw rgba(0,0,0,.5)}
  .ov p{margin:0;font-size:1.5cqw;opacity:.85}
  .ov .btn{margin-top:1cqw;padding:.9cqw 3cqw;border:.15cqw solid #fff;border-radius:10cqw;font-size:1.7cqw;background:rgba(255,255,255,.1);backdrop-filter:blur(4px)}
  .ov:hover .btn{background:rgba(255,255,255,.25)}
  .ctrl{position:absolute;left:0;right:0;bottom:1.1cqw;display:flex;align-items:center;gap:.8cqw;padding:0 1.4cqw;opacity:0;transition:opacity .3s;color:#fff;font-size:1.1cqw;text-shadow:0 0 .5cqw rgba(0,0,0,.7)}
  #stage:hover .ctrl{opacity:1}
  .ctrl button{background:rgba(0,0,0,.35);color:#fff;border:.1cqw solid rgba(255,255,255,.6);border-radius:.5cqw;width:2.6cqw;height:2.2cqw;font-size:1.1cqw;cursor:pointer}
  .ctrl button:hover{background:rgba(255,255,255,.3)}
  #bar{position:absolute;left:0;right:0;bottom:0;height:.9cqw;cursor:pointer}
  #bar::before{content:"";position:absolute;left:0;right:0;bottom:0;height:.35cqw;background:rgba(255,255,255,.2)}
  #fill{position:absolute;left:0;bottom:0;height:.35cqw;width:0;background:#fff;display:block;box-shadow:0 0 .6cqw rgba(255,255,255,.7)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div class="ctrl"><button id="pp" title="재생/일시정지 (Space)">▶</button><button id="rs" title="처음부터 (R)">↺</button><button id="mu" title="소리 켜기/끄기">🔊</button><span id="tm">0:00 / 0:30</span></div>
  <div id="bar"><i id="fill"></i></div>
  <div class="ov" id="startOv"><h1>인생의 계절</h1><p>30초 영상 · 소리가 나옵니다</p><div class="btn">▶ 재생</div></div>
  <div class="ov hide" id="endOv"><div class="btn">↺ 다시 보기</div></div>
</div>

<script>
(() => {
const W = 1920, H = 1080, DUR = 30;
try { document.fonts.load('40px "Jua"'); document.fonts.load('40px "Gowun Dodum"'); } catch(_) {}
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

/* ---------- 유틸 ---------- */
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const sm = x => { x = clamp(x); return x*x*(3-2*x); };
const mod = (a,m) => ((a % m) + m) % m;
const rnd = n => { const s = Math.sin(n*127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const rgb = (c,a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix = (a,b,t) => a.map((v,i) => v + (b[i]-v)*t);

/* ---------- 장면 팔레트 ---------- */
const mk = (skyT,skyB,h1,h2,leaf,sun,text,dens,sunR,sunY,stars,snow,grass,rays,cloud) => ({
  skyT:hex(skyT), skyB:hex(skyB), h1:hex(h1), h2:hex(h2), leaf:hex(leaf), sun:hex(sun), text:hex(text),
  dens,sunR,sunY,stars,snow,grass,rays,cloud
});
const FX = {
  1:{type:'mote', c:'#fff3a0', n:45, size:3.5, vy:18},
  2:{type:'fall', c:'#ffc4d8', n:80, size:9,  vx:45, vy:70, amp:50, rot:1.5, ratio:.55, tumble:1},
  3:{type:'mote', c:'#eaffb4', n:55, size:4,   vy:22},
  4:{type:'mote', c:'#fffbd0', n:45, size:4.5, vy:12},
  5:{type:'fall', c:'#f0b030', n:45, size:11, vx:25, vy:55, amp:40, rot:1.2, ratio:.5, tumble:1},
  6:{type:'fall', c:'#d83a28', n:60, size:13, vx:40, vy:80, amp:50, rot:1.4, ratio:.5, tumble:1},
  7:{type:'fall', c:'#8b5a2b', n:45, size:12, vx:90, vy:90, amp:60, rot:1.8, ratio:.5, tumble:1},
  8:{type:'snow', c:'#ffffff', n:150, size:4.5, vx:20, vy:90, amp:30},
  9:{type:'snow', c:'#ffffff', n:80,  size:4,   vx:10, vy:40, amp:20}
};
// s=시작, e=끝 (초) — 시간표는 여기서 수정
const SC = [
  {s:0,    e:2,    p:mk('#0b1026','#1d2a4f','#18213d','#10172b','#2a3a5a','#e8ecff','#ffffff', 0,44,230,1,0,0,0,0), center:'인생을 계절에 비유하면'},
  {s:2,    e:5,    p:mk('#bfe3dd','#f1f6dc','#a9cf8a','#86b96a','#9fd36b','#fff4b8','#2f4a2a', .4,60,270,0,0,.8,.2,.5), age:'10대', season:'이른봄', desc:'싹트는 계절'},
  {s:5,    e:8,    p:mk('#ffd9e6','#fff4f0','#bfe0a0','#9ccf80','#ffb7cf','#fff1c9','#6b2d45', .95,56,250,0,0,1,.2,.7), age:'20대', season:'봄', desc:'꽃피는 계절'},
  {s:8,    e:11,   p:mk('#8fd3f0','#e4f7e0','#7fc47a','#5aae5c','#5cc05a','#fffbd0','#1f4a2c', 1,64,240,0,0,1,.4,.8), age:'30대', season:'초여름', desc:'신록의 계절'},
  {s:11,   e:14,   p:mk('#3fa7e6','#bfe9f7','#4fa855','#2f8a3f','#2f9a3c','#fff6a8','#0d3b2a', 1,90,200,0,0,1,.8,.6), age:'40대', season:'한여름', desc:'성숙의 계절'},
  {s:14,   e:17,   p:mk('#f5b66a','#fde8b8','#d9a94a','#b88a2e','#e8a62a','#ffe29a','#5a3512', 1,76,240,0,0,.7,.3,.5), age:'50대', season:'가을', desc:'수확의 계절'},
  {s:17,   e:20,   p:mk('#c9604a','#f4b88a','#b8542f','#8f3a22','#d4392b','#ffd9a0','#fff6e8', .95,70,260,0,0,.5,.2,.4), age:'60대', season:'늦가을', desc:'단풍의 계절'},
  {s:20,   e:23,   p:mk('#7c7a86','#c9c2bd','#8a7a70','#6a5a52','#8b5a2b','#e8e2da','#ffffff', .12,56,270,0,0,.2,0,.6), age:'70대', season:'초겨울', desc:'낙엽의 계절'},
  {s:23,   e:26,   p:mk('#8fa6c4','#e4edf6','#f2f6fb','#ffffff','#ffffff','#ffffff','#1d3350', 0,50,260,0,.7,0,0,.5), age:'80대', season:'한겨울', desc:'백설의 계절'},
  {s:26,   e:28.5, p:mk('#0b1026','#26335c','#6b7899','#8794b4','#ffffff','#eef2ff','#ffffff', 0,44,200,1,.8,0,0,0), age:'90대', season:'긴 겨울밤', desc:'잠자는 계절'},
  {s:28.5, e:30,   p:mk('#14102a','#5a3d52','#4a4468','#5a5478','#ffffff','#ffe9c9','#fff1dc', 0,52,210,.8,.8,0,0,0), center:'당신은 지금 어느 계절을 지나고 계신가요?'}
];
SC.forEach((S,i) => S.fx = FX[i]);
const TR = 0.9; // 장면 전환 시간

function sceneIndex(t){ let i = 0; for (let k = 0; k < SC.length; k++) if (t >= SC[k].s) i = k; return i; }
function lerpP(a,b,t){ const o = {}; for (const k in a) o[k] = Array.isArray(a[k]) ? mix(a[k],b[k],t) : a[k] + (b[k]-a[k])*t; return o; }
function params(t,si){
  const cur = SC[si].p;
  if (si > 0) { const u = (t - SC[si].s) / TR; if (u < 1) return lerpP(SC[si-1].p, cur, sm(u)); }
  return cur;
}
// 나무 크기: 새싹 → 큰 나무
const KF = [[1.8,0],[3.0,0.16],[5.0,0.24],[7.8,0.62],[10.5,0.86],[13,1],[30,1]];
function scaleAt(t){
  if (t <= KF[0][0]) return KF[0][1];
  for (let i = 0; i < KF.length-1; i++) {
    const a = KF[i], b = KF[i+1];
    if (t < b[0]) return a[1] + (b[1]-a[1]) * sm((t-a[0])/(b[0]-a[0]));
  }
  return 1;
}

/* ---------- 나무 생성 (시드 고정) ---------- */
let seed = 11;
const tr = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; };
const SEG = [], LEAVES = [];
function grow(x,y,ang,len,w,d){
  const x2 = x + Math.sin(ang)*len, y2 = y - Math.cos(ang)*len;
  SEG.push({x1:x,y1:y,x2,y2,w});
  if (d >= 5) {
    const n = d >= 7 ? 2 : 1;
    for (let k = 0; k < n; k++) LEAVES.push({x:x2+(tr()-.5)*.05, y:y2+(tr()-.5)*.05, r:tr(), sh:tr(), sz:tr(), r2:tr()});
  }
  if (d >= 8) return;
  const n = (d < 4 && tr() < 0.3) ? 3 : 2;
  for (let k = 0; k < n; k++) {
    const da = n === 2 ? (k ? 1 : -1) * (0.28 + tr()*0.35) : (k-1) * (0.45 + tr()*0.2);
    grow(x2,y2, ang + da + (tr()-.5)*.15, len*(0.7 + tr()*0.08), w*0.67, d+1);
  }
}
grow(0,0,0,0.2,0.03,0);

/* ---------- 지형 ---------- */
const y1 = x => 700 + Math.sin(x*0.0028+1)*55 + Math.sin(x*0.0071)*22;
const y2 = x => 860 + Math.sin(x*0.0042+2)*40 + Math.sin(x*0.011)*8;
const TREE_X = 1250, SUN_X = 1650, U = 700;

function hill(fn,col){
  ctx.fillStyle = rgb(col);
  ctx.beginPath(); ctx.moveTo(0,H);
  for (let x = 0; x <= W; x += 16) ctx.lineTo(x, fn(x));
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}

function drawTree(p,t,sc){
  if (sc < 0.005) return;
  const k = U*sc, bx = TREE_X, by = y2(TREE_X) + 25;
  const sway = y => Math.sin(t*1.3 - y*3) * 0.015 * (-y);
  ctx.lineCap = 'round'; ctx.strokeStyle = '#5b4334';
  for (const s of SEG) {
    ctx.lineWidth = Math.max(1.2, s.w*k);
    ctx.beginPath();
    ctx.moveTo(bx + (s.x1 + sway(s.y1))*k, by + s.y1*k);
    ctx.lineTo(bx + (s.x2 + sway(s.y2))*k, by + s.y2*k);
    ctx.stroke();
  }
  const r = 5 + 24*sc;
  if (p.dens > 0.01) {
    for (const L of LEAVES) {
      if (L.r > p.dens) continue;
      const sh = (L.sh - .5) * 50;
      ctx.fillStyle = rgb([clamp(p.leaf[0]+sh,0,255), clamp(p.leaf[1]+sh*.8,0,255), clamp(p.leaf[2]+sh*.6,0,255)], .93);
      ctx.beginPath();
      ctx.arc(bx + (L.x + sway(L.y))*k, by + L.y*k, r*(.8 + L.sz*.5), 0, 6.283);
      ctx.fill();
    }
  }
  if (p.snow > 0.05) {
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    for (const L of LEAVES) {
      if (L.r2 > p.snow*0.85) continue;
      ctx.beginPath();
      ctx.arc(bx + (L.x + sway(L.y))*k, by + L.y*k - 2, 3 + 6*sc, 0, 6.283);
      ctx.fill();
    }
  }
}

/* ---------- 사람들 (장면별 이야기) ---------- */
const gyAt = x => y2(x) + 6;
const SKIN = '#f2c9a0';
const darker = s => rgb(hex(s).map(v => v*.8));
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill(); }
function heart(x,y,s,col,al){
  ctx.save(); ctx.globalAlpha *= al; ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x, y + s*0.35);
  ctx.bezierCurveTo(x - s*1.1, y - s*0.3, x - s*0.5, y - s*1.1, x, y - s*0.45);
  ctx.bezierCurveTo(x + s*0.5, y - s*1.1, x + s*1.1, y - s*0.3, x, y + s*0.35);
  ctx.fill(); ctx.restore();
}
function risingHearts(t,x,y,n,col){
  for (let i = 0; i < n; i++) {
    const ph = (t*0.4 + i/n) % 1;
    heart(x + Math.sin(ph*6 + i*2)*16, y - ph*90, 8 + 4*(1-ph), col || '#ff7a9a', sm(ph*4)*(1-ph));
  }
}

function sparkle(x,y,s,al,col){
  ctx.save(); ctx.globalAlpha *= al; ctx.fillStyle = col || '#fff7b0'; ctx.beginPath();
  ctx.moveTo(x,y - s); ctx.quadraticCurveTo(x,y,x + s,y); ctx.quadraticCurveTo(x,y,x,y + s); ctx.quadraticCurveTo(x,y,x - s,y); ctx.quadraticCurveTo(x,y,x,y - s);
  ctx.fill(); ctx.restore();
}
function balloon(hx,hy,col,t){
  const sw = Math.sin(t*1.8)*6, tx = hx + sw, ty = hy - 85;
  ctx.strokeStyle = 'rgba(90,90,90,.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.quadraticCurveTo(hx + sw*.2,hy - 45,tx,ty + 19); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(tx,ty,15,19,0,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx,ty + 18); ctx.lineTo(tx - 4,ty + 25); ctx.lineTo(tx + 4,ty + 25); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(tx - 5,ty - 7,3.5,6,-0.5,0,6.283); ctx.fill();
}

/* o: x,H,flip,hair,hairStyle(long|bun),cloth,pants,tie,hat,hatCol,stoop,cane,caneK,chair,jump,dress,eyes,reach[front,back](세계좌표) */
function figure(o,t){
  const H = o.H, x = o.x, flip = o.flip || 1, jump = o.jump || 0, chair = o.chair || 0;
  const gy = gyAt(x), gb = gy - jump, A = ctx.globalAlpha;
  const cf = clamp((170 - H)/50);
  const legL = H*(0.45 - 0.03*cf), torso = H*0.33, hr = H*(0.11 + 0.04*cf), armL = H*0.36;
  const hipX = x, hipY = gb - (chair ? legL*0.5 : legL);
  const lean = (o.stoop || 0) + 0.012*Math.sin(t*1.6 + x);
  const ca = Math.cos(lean), sa = Math.sin(lean);
  const P = (px,py) => [hipX + px*ca - py*sa, hipY + px*sa + py*ca];
  const mapX = v => flip < 0 ? 2*x - v : v;
  const lp = (a,b,k) => [a[0] + (b[0]-a[0])*k, a[1] + (b[1]-a[1])*k];
  ctx.save();
  if (flip < 0) { ctx.translate(x,0); ctx.scale(-1,1); ctx.translate(-x,0); }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath();
  ctx.ellipse(x + (chair ? legL*.25 : 0), gy + 2, H*Math.max(.1, .2 - jump*0.0015), H*.03, 0, 0, 6.283); ctx.fill();
  const sh = P(0,-torso);
  // 다리
  for (let k = 0; k < 2; k++) {
    let foot, knee;
    if (chair) { knee = [x + legL*0.5 + k*H*0.03, hipY]; foot = [knee[0] + H*0.02, gb]; }
    else {
      const sp = (k ? -1 : 1);
      foot = [x + sp*H*0.06 + (jump ? sp*H*0.03 : 0), gb];
      knee = [(hipX + foot[0])/2, (hipY + gb)/2 - (jump ? H*0.02 : 0)];
    }
    ctx.strokeStyle = k ? darker(o.pants) : o.pants; ctx.lineWidth = H*0.075;
    ctx.beginPath(); ctx.moveTo(hipX,hipY); ctx.lineTo(knee[0],knee[1]); ctx.lineTo(foot[0],foot[1]); ctx.stroke();
    ctx.fillStyle = '#2a2a2a'; ctx.beginPath(); ctx.ellipse(foot[0] + H*0.025, foot[1], H*0.05, H*0.025, 0, 0, 6.283); ctx.fill();
  }
  // 치마
  if (o.dress && !chair) {
    ctx.fillStyle = o.cloth; ctx.beginPath();
    ctx.moveTo(hipX - H*0.09, hipY - H*0.03); ctx.lineTo(hipX + H*0.09, hipY - H*0.03);
    ctx.lineTo(hipX + H*0.17, hipY + legL*0.62); ctx.lineTo(hipX - H*0.17, hipY + legL*0.62); ctx.closePath(); ctx.fill();
  }
  // 손 위치
  const caneTop = [sh[0] + H*0.10, gb - H*0.42], caneK = o.caneK == null ? 1 : o.caneK;
  const hands = [0,1].map(k => {
    let h;
    if (o.reach && o.reach[k]) h = [mapX(o.reach[k][0]), o.reach[k][1]];
    else if (chair) h = [x + legL*0.38 + k*H*0.05, hipY - H*0.04];
    else h = P((k ? -1 : 1)*H*0.04 + Math.sin(t*1.3 + k*2)*H*0.01, -torso + armL);
    if (o.cane && k === caneK) h = lp(h, caneTop, o.cane);
    return h;
  });
  if (o.cane) {
    ctx.globalAlpha = A*o.cane; ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = H*0.02;
    ctx.beginPath(); ctx.moveTo(caneTop[0],caneTop[1]); ctx.lineTo(caneTop[0] + H*0.02, gb); ctx.stroke();
    ctx.globalAlpha = A;
  }
  const arm = (k,col) => {
    const h = hands[k], el = [(sh[0]+h[0])/2 - H*0.02, (sh[1]+h[1])/2 + H*0.015];
    ctx.strokeStyle = col; ctx.lineWidth = H*0.06;
    ctx.beginPath(); ctx.moveTo(sh[0],sh[1]); ctx.lineTo(el[0],el[1]); ctx.lineTo(h[0],h[1]); ctx.stroke();
    ctx.fillStyle = SKIN; circ(h[0],h[1],H*0.032);
  };
  arm(1, darker(o.cloth));
  // 몸통
  const a = P(0,-H*0.02), b = P(0,-torso + H*0.02);
  ctx.strokeStyle = o.cloth; ctx.lineWidth = H*(0.19 + 0.02*cf);
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  if (o.tie) { const t1 = P(H*0.03,-torso + H*0.02), t2 = P(H*0.03,-torso + H*0.13); ctx.strokeStyle = o.tie; ctx.lineWidth = H*0.028; ctx.beginPath(); ctx.moveTo(t1[0],t1[1]); ctx.lineTo(t2[0],t2[1]); ctx.stroke(); }
  // 머리
  const ang = lean;
  const hc = [sh[0] + hr*1.25*Math.sin(ang), sh[1] - hr*1.25*Math.cos(ang)];
  ctx.strokeStyle = SKIN; ctx.lineWidth = H*0.05;
  ctx.beginPath(); ctx.moveTo(sh[0],sh[1]); ctx.lineTo(hc[0],hc[1]); ctx.stroke();
  if (o.hairStyle === 'long') { ctx.fillStyle = o.hair; ctx.beginPath(); ctx.ellipse(hc[0] - hr*.5, hc[1] + hr*.9, hr*.8, hr*1.5, 0.1, 0, 6.283); ctx.fill(); }
  if (o.hairStyle === 'bun') { ctx.fillStyle = o.hair; circ(hc[0] - hr*.7, hc[1] - hr*.95, hr*.42); }
  ctx.fillStyle = o.hair; circ(hc[0] - hr*.12, hc[1] - hr*.14, hr*1.06);
  ctx.fillStyle = SKIN; circ(hc[0] + hr*.08, hc[1] + hr*.08, hr*.96);
  ctx.fillStyle = 'rgba(255,120,130,.28)'; circ(hc[0] + hr*.5, hc[1] + hr*.42, hr*.2);

function drawFx(t){

    if (a <= 0.01) continue;
    const f = S.fx;
    ctx.fillStyle = f.c;
    for (let i = 0; i < f.n; i++) {
      const r1 = rnd(i*3.1 + si*100), r2 = rnd(i*5.7 + si*100 + 1), r3 = rnd(i*7.3 + si*100 + 2);
      const s = f.size * (0.6 + r3*0.8);

        const x = mod(r1*W + Math.sin(t*0.7 + r3*6.28)*30, W);
        const y = mod(r2*H - t*f.vy*(0.5 + r3), H);

  } else if (e.k === 'lead') {
    const lp = filt(2600), o = osc('sine',f,0,1,lp); osc('sine',f*2,0,.12,lp);
    const lfo = ac.createOscillator(); lfo.frequency.value = 5.2; const lg = ac.createGain(); lg.gain.value = f*0.006;
    lfo.connect(lg); lg.connect(o.frequency); lfo.start(when); oscs.push(lfo);
    const rl = Math.min(.5,d*.5);
    g.gain.linearRampToValueAtTime(e.v, when+Math.min(.1,d*.4)); g.gain.setValueAtTime(e.v, Math.max(when+.12,end-rl)); g.gain.linearRampToValueAtTime(0.0001, end+.1);
  } else if (e.k === 'box') {
    const lp = filt(5000); osc('sine',f,0,1,lp); osc('sine',f*3,0,.22,lp); osc('triangle',f*2,0,.15,lp);
    g.gain.linearRampToValueAtTime(e.v, when+.004); g.gain.exponentialRampToValueAtTime(0.0008, end);
  } else if (e.k === 'str') {
    const lp = filt(1400), at = Math.min(.7,d*.4), rl = Math.min(.8,d*.4);
    osc('sawtooth',f,-7,.5,lp); osc('sawtooth',f,7,.5,lp); osc('sine',f,0,.6,lp);
    g.gain.linearRampToValueAtTime(e.v, when+at); g.gain.setValueAtTime(e.v, Math.max(when+at, end-rl)); g.gain.linearRampToValueAtTime(0.0001, end);
  } else if (e.k === 'cello') {
    const lp = filt(900), o = osc('sawtooth',f,0,.7,lp); osc('sine',f,0,.6,lp);
    const lfo = ac.createOscillator(); lfo.frequency.value = 5; const lg = ac.createGain(); lg.gain.value = f*0.008;
    lfo.connect(lg); lg.connect(o.frequency); lfo.start(when); oscs.push(lfo);
    const rl = Math.min(.4,d*.4);
    g.gain.linearRampToValueAtTime(e.v, when+Math.min(.18,d*.4)); g.gain.setValueAtTime(e.v, Math.max(when+.2,end-rl)); g.gain.linearRampToValueAtTime(0.0001, end+.05);
  } else if (e.k === 'hat') {
    const src = ac.createBufferSource(); src.buffer = noiseBuf(); const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    src.connect(hp); hp.connect(g); src.start(when); oscs.push(src);
    g.gain.linearRampToValueAtTime(e.v, when+.002); g.gain.exponentialRampToValueAtTime(0.0008, when+.06); stop = when + .1;
  } else if (e.k === 'kick') {
    const o = osc('sine',110,0,1,g); o.frequency.setValueAtTime(120, when); o.frequency.exponentialRampToValueAtTime(42, when+.12);
    g.gain.linearRampToValueAtTime(e.v, when+.004); g.gain.exponentialRampToValueAtTime(0.0008, when+.25); stop = when + .3;
  } else { // chime
    const lp = filt(6000); osc('sine',f,0,1,lp); osc('sine',f*2.76,0,.18,lp);
    g.gain.linearRampToValueAtTime(e.v, when+.005); g.gain.exponentialRampToValueAtTime(0.0008, end); stop = end + .1;
  }
  oscs.forEach(o => o.stop(stop));
}
function musicSeek(tt){
  if (!ac) return;
  newBus();
  evIdx = EV.findIndex(e => e.t >= tt); if (evIdx < 0) evIdx = EV.length;
  for (const e of EV) if ((e.k === 'pad' || e.k === 'lead' || e.k === 'bass' || e.k === 'str' || e.k === 'cello') && e.t < tt && tt < e.t + e.d - 0.3) playEv(e, ac.currentTime, e.t + e.d - tt);
}
function musicTick(tt){
  if (!ac) return;
  const env = muted ? 0 : 0.85*Math.min(sm(tt/1.5), sm((DUR-tt)/2.2));
  master.gain.setTargetAtTime(env, ac.currentTime, 0.08);
  if (!playing) return;
  const look = tt + 0.25;
  while (evIdx < EV.length && EV[evIdx].t < look) { const e = EV[evIdx++]; playEv(e, ac.currentTime + (e.t - tt), e.d); }
}

/* ---------- 재생 컨트롤 ---------- */
const $ = id => document.getElementById(id);
const pp = $('pp'), tm = $('tm'), fill = $('fill'), startOv = $('startOv'), endOv = $('endOv');
let t = 0, playing = false, started = false, ended = false, last = 0;
const fmt = s => `0:${String(Math.floor(s)).padStart(2,'0')}`;
function updatePP(){ pp.textContent = playing ? '❚❚' : '▶'; }
function setPlaying(v){
  playing = v; updatePP();
  if (ac) { if (v) ac.resume(); else ac.suspend(); }
}
function restart(){
  t = 0; started = true; ended = false;
  startOv.classList.add('hide'); endOv.classList.add('hide');
  ensureAudio(); musicSeek(0); setPlaying(true);
}
function toggle(){
  if (!started || ended) return restart();
  setPlaying(!playing);
}
$('mu').addEventListener('click', e => { muted = !muted; e.currentTarget.textContent = muted ? '🔇' : '🔊'; });
startOv.addEventListener('click', restart);
endOv.addEventListener('click', restart);
pp.addEventListener('click', toggle);
$('rs').addEventListener('click', restart);
$('bar').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  t = clamp((e.clientX - r.left)/r.width) * DUR;
  if (!started) { started = true; startOv.classList.add('hide'); }
  ensureAudio();
  if (ended) { ended = false; endOv.classList.add('hide'); musicSeek(t); setPlaying(true); }
  else musicSeek(t);
});
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') restart();
});

function tick(ts){
  if (!last) last = ts;
  const dt = Math.min(0.1, (ts - last)/1000); last = ts;
  if (playing) {
    t += dt;
    if (t >= DUR) { t = DUR; ended = true; endOv.classList.remove('hide'); setPlaying(false); }
  }
  musicTick(t);
  render(started ? t : 1.3);
  fill.style.width = (t/DUR*100) + '%';
  tm.textContent = `${fmt(t)} / 0:30`;
  requestAnimationFrame(tick);
}
window.lifeSeasons = { seek(x){ t = x; started = true; ended = false; startOv.classList.add('hide'); endOv.classList.add('hide'); musicSeek(t); setPlaying(false); } };
requestAnimationFrame(tick);
})();
</script>
